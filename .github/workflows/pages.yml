name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storybook/package-lock.json

      - name: Install dependencies
        working-directory: storybook
        run: npm ci

      - name: Link prototype dependencies
        run: ln -sfn ../storybook/node_modules prototype/node_modules

      # enablement asks GitHub to turn Pages on with source GitHub Actions.
      # GITHUB_TOKEN cannot create the Pages site (that needs administration).
      # The build and deploy still run so a later re-run can publish once Pages is on.
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site from source
        id: source
        continue-on-error: true
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID != '' && vars.GA_MEASUREMENT_ID || 'G-T7WTSRRSGT' }}
        run: ./build-site.sh

      - name: Keep the committed site if the source build failed
        if: steps.source.outcome != 'success'
        run: echo "Source build failed. Uploading the committed site/ folder."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
